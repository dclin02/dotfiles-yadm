# Firefox (WebRTC/Meet): pede blocos maiores e regulares ao pipewire-pulse.
# Com o padrão do PipeWire 1.6 (minreq ~6 ms) o jitter buffer do Firefox oscila e
# o NetEq acelera/esconde áudio (artefatos). 1024/48000 ≈ 21 ms por bloco.
pulse.rules = [
  {
    matches = [ { application.process.binary = "firefox" } ]
    actions = {
      update-props = {
        pulse.min.req     = 1024/48000
        pulse.min.quantum = 1024/48000
      }
    }
  }
]
