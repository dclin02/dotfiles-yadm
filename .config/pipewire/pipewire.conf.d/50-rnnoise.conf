# Supressão de ruído RNNoise (werman/noise-suppression-for-voice v1.10) para o Husky Howl
context.modules = [
{   name = libpipewire-module-filter-chain
    args = {
        node.description = "Husky Howl (RNNoise)"
        media.name       = "Husky Howl (RNNoise)"
        filter.graph = {
            nodes = [
                {
                    type   = ladspa
                    name   = rnnoise
                    plugin = /home/daniel.lin/.local/lib/ladspa/librnnoise_ladspa.so
                    label  = noise_suppressor_mono
                    control = {
                        "VAD Threshold (%)"          = 50.0
                        "VAD Grace Period (ms)"      = 200
                        "Retroactive VAD Grace (ms)" = 0
                    }
                }
                {
                    # Gate depois do RNNoise: corta o que sobrar abaixo do Threshold (dB)
                    type   = ladspa
                    name   = gate
                    plugin = /usr/lib/ladspa/ZamGate-ladspa.so
                    label  = ZamGate
                    control = {
                        "Threshold"      = -40.0
                        "Attack"         = 2.0
                        "Release"        = 200.0
                        "Max gate close" = -40.0
                        "Makeup"         = 0.0
                        "Sidechain"      = 0.0
                    }
                }
            ]
            links = [
                { output = "rnnoise:Output" input = "gate:Audio Input 1" }
            ]
            inputs  = [ "rnnoise:Input" ]
            outputs = [ "gate:Audio Output 1" ]
        }
        capture.props = {
            node.name      = "capture.rnnoise_source"
            node.passive   = true
            audio.rate     = 48000
            target.object  = "alsa_input.usb-Husky_Howl_Husky_Howl_REV1.0-00.analog-stereo"
            # Não deixa o WirePlumber memorizar outro mic (ex.: mover no pavucontrol) por cima do target.object
            state.restore-target = false
        }
        playback.props = {
            node.name      = "rnnoise_source"
            media.class    = Audio/Source
            audio.rate     = 48000
        }
    }
}
]
