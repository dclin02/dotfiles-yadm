# Mic para calls na caixa de som: Husky -> cancelamento de eco (WebRTC) -> RNNoise -> gate
# Fica separado do 50-rnnoise.conf para não aplicar AEC com fone ou em apps que já têm AEC (Meet, Discord)
context.modules = [
{   name = libpipewire-module-echo-cancel
    args = {
        library.name   = aec/libspa-aec-webrtc
        # Usa o que toca na saída padrão como referência, sem precisar de um sink próprio
        monitor.mode   = true
        audio.channels = 1
        audio.position = [ MONO ]
        aec.args = {
            # Ruído e ganho ficam com o RNNoise/gate abaixo
            webrtc.noise_suppression = false
            webrtc.gain_control      = false
        }
        capture.props = {
            node.name            = "capture.husky_aec"
            node.passive         = true
            target.object        = "alsa_input.usb-Husky_Howl_Husky_Howl_REV1.0-00.analog-stereo"
            state.restore-target = false
        }
        source.props = {
            node.name        = "husky_aec_raw"
            node.description = "Husky Howl (AEC, sem RNNoise)"
        }
        sink.props = {
            node.name    = "husky_aec_reference"
            node.passive = true
        }
    }
}
{   name = libpipewire-module-filter-chain
    args = {
        node.description = "Husky Howl (AEC)"
        media.name       = "Husky Howl (AEC)"
        filter.graph = {
            nodes = [
                {
                    type   = ladspa
                    name   = rnnoise
                    plugin = /home/daniel.lin/.local/lib/ladspa/librnnoise_ladspa.so
                    label  = noise_suppressor_mono
                    control = {
                        "VAD Threshold (%)"          = 50.0
                        "VAD Grace Period (ms)"      = 200
                        "Retroactive VAD Grace (ms)" = 0
                    }
                }
                {
                    type   = ladspa
                    name   = gate
                    plugin = /usr/lib/ladspa/ZamGate-ladspa.so
                    label  = ZamGate
                    control = {
                        "Threshold"      = -40.0
                        "Attack"         = 2.0
                        "Release"        = 200.0
                        "Max gate close" = -40.0
                        "Makeup"         = 0.0
                        "Sidechain"      = 0.0
                    }
                }
            ]
            links = [
                { output = "rnnoise:Output" input = "gate:Audio Input 1" }
            ]
            inputs  = [ "rnnoise:Input" ]
            outputs = [ "gate:Audio Output 1" ]
        }
        capture.props = {
            node.name            = "capture.rnnoise_aec_source"
            node.passive         = true
            audio.rate           = 48000
            target.object        = "husky_aec_raw"
            state.restore-target = false
        }
        playback.props = {
            node.name   = "rnnoise_aec_source"
            media.class = Audio/Source
            audio.rate  = 48000
        }
    }
}
]
