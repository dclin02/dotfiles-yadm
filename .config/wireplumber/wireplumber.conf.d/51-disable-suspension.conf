# Só o DX3 e o mic Husky ficam sempre acordados (evita estalo/atraso ao começar a tocar).
# Antes valia para todos os ALSA: HDMI x3, BTD 700, P2 do notebook, webcam etc. ficavam
# rodando ociosos em ciclos de 256 e atrasando o data-loop do PipeWire (WAIT ~38 ms),
# o que gerava cortes no DX3.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Topping_DX3_Pro_-00.*"
      },
      {
        node.name = "~alsa_input.usb-Husky_Howl_Husky_Howl_REV1.0-00.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
# bluetooth devices
monitor.bluez.rules = [
  {
    matches = [
      {
        # Matches all sources
        node.name = "~bluez_input.*"
      },
      {
        # Matches all sinks
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
