# Port de main.lua.d/50-alsa-config.lua para WirePlumber 0.5
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.usb-Topping_DX3_Pro_-00.*" } ]
    actions = {
      update-props = {
        audio.format        = "S32LE"
        audio.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 ]
      }
    }
  }
  {
    matches = [ { device.name = "~alsa_card.*" } ]
    actions = {
      update-props = {
        api.acp.auto-profile = false
        api.acp.auto-port    = false
      }
    }
  }
]
