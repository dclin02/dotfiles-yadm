# BTD 700 (dongle do HDB 630): ignora o volume de hardware do dongle, que vira
# volume absoluto (AVRCP) no fone. O PipeWire passa a atenuar em software e o
# dongle fica fixo em 100% (amixer -c B700 sset PCM 100%).
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-Sennheiser_BTD_700*" } ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
